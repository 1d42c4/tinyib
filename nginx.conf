# Standalone nginx configuration. Run with nginx's installation directory as prefix.
# Windows: nginx.exe -p C:/nginx/ -c C:/path/to/tinyib/nginx.conf
worker_processes 1;
pid logs/tinyib-nginx.pid;
error_log logs/tinyib-error.log;

events {
    worker_connections 512;
}

http {
    types {
        text/html html htm;
        text/css css;
        application/javascript js;
        application/json json;
        image/png png;
        image/jpeg jpg jpeg;
        image/gif gif;
        image/webp webp;
        image/x-icon ico;
        video/mp4 mp4;
        video/webm webm;
        audio/mpeg mp3;
        audio/ogg ogg opus;
        audio/flac flac;
        audio/wav wav;
    }
    default_type application/octet-stream;
    access_log logs/tinyib-access.log;
    sendfile on;
    server_tokens off;
    gzip on;
    gzip_types text/css application/javascript application/json;

    server {
        # Local access. Set your domain, TLS and listen address for deployment.
        listen 127.0.0.1:8080;
        server_name localhost;
        root C:/path/to/tinyib;
        index index.html;
        charset utf-8;
        autoindex off;
        client_max_body_size 3m;
        add_header X-Content-Type-Options nosniff always;

        # Only these two PHP entry points may execute.
        location = /imgboard.php {
            fastcgi_param QUERY_STRING $query_string;
            fastcgi_param REQUEST_METHOD $request_method;
            fastcgi_param CONTENT_TYPE $content_type;
            fastcgi_param CONTENT_LENGTH $content_length;
            fastcgi_param SCRIPT_NAME $fastcgi_script_name;
            fastcgi_param REQUEST_URI $request_uri;
            fastcgi_param DOCUMENT_URI $document_uri;
            fastcgi_param DOCUMENT_ROOT $document_root;
            fastcgi_param SERVER_PROTOCOL $server_protocol;
            fastcgi_param REQUEST_SCHEME $scheme;
            fastcgi_param HTTPS $https if_not_empty;
            fastcgi_param GATEWAY_INTERFACE CGI/1.1;
            fastcgi_param SERVER_SOFTWARE nginx;
            fastcgi_param REMOTE_ADDR $remote_addr;
            fastcgi_param REMOTE_PORT $remote_port;
            fastcgi_param SERVER_ADDR $server_addr;
            fastcgi_param SERVER_PORT $server_port;
            fastcgi_param SERVER_NAME $server_name;
            fastcgi_param REDIRECT_STATUS 200;
            fastcgi_param SCRIPT_FILENAME $document_root/imgboard.php;
            fastcgi_param HTTP_PROXY "";
            fastcgi_pass 127.0.0.1:9000;
        }
        location = /inc/captcha.php {
            fastcgi_param QUERY_STRING $query_string;
            fastcgi_param REQUEST_METHOD $request_method;
            fastcgi_param CONTENT_TYPE $content_type;
            fastcgi_param CONTENT_LENGTH $content_length;
            fastcgi_param SCRIPT_NAME $fastcgi_script_name;
            fastcgi_param REQUEST_URI $request_uri;
            fastcgi_param DOCUMENT_URI $document_uri;
            fastcgi_param DOCUMENT_ROOT $document_root;
            fastcgi_param SERVER_PROTOCOL $server_protocol;
            fastcgi_param REQUEST_SCHEME $scheme;
            fastcgi_param HTTPS $https if_not_empty;
            fastcgi_param GATEWAY_INTERFACE CGI/1.1;
            fastcgi_param SERVER_SOFTWARE nginx;
            fastcgi_param REMOTE_ADDR $remote_addr;
            fastcgi_param REMOTE_PORT $remote_port;
            fastcgi_param SERVER_ADDR $server_addr;
            fastcgi_param SERVER_PORT $server_port;
            fastcgi_param SERVER_NAME $server_name;
            fastcgi_param REDIRECT_STATUS 200;
            fastcgi_param SCRIPT_FILENAME $document_root/inc/captcha.php;
            fastcgi_param HTTP_PROXY "";
            fastcgi_pass 127.0.0.1:9000;
        }

        # Internal code, tests, fonts, private files and upload scripts.
        location ^~ /app/ { return 404; }
        location ^~ /tests/ { return 404; }
        location ^~ /inc/ { return 404; }
        location ~ /\. { return 404; }
        location ~* \.(?:php(?:[0-9]+)?|phtml|phar)(?:/|$) { return 404; }
        location ~* \.(?:db(?:-wal|-shm|-journal)?|sqlite3?|accounts|bans|keywords|logs|posts|reports|lock|ini|conf|md|ps1|bat|cmd|log|bak|zip)$ { return 404; }
        location = /LICENSE { return 404; }
        location = /phpstan.neon { return 404; }
        location = /composer.json { return 404; }
        location = /composer.lock { return 404; }

        # Static board HTML/JSON must be revalidated after a rebuild.
        location ~* \.(?:html|json)$ {
            etag off;
            add_header Cache-Control "no-cache";
            add_header X-Content-Type-Options nosniff always;
            try_files $uri =404;
        }
        location ~* \.(?:css|js|ico|gif|jpe?g|png|webp|mp4|webm|mp3|ogg|wav)$ {
            expires 7d;
            try_files $uri =404;
        }
        location / {
            try_files $uri $uri/ =404;
        }
    }
}
